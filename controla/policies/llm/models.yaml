# Registre des modèles assignables à un siège.
#
# Chaque entrée associe un nom de modèle (transmis TEL QUEL à l'API) à :
#   provider      → sert à lire {PROVIDER}_BASE_URL et {PROVIDER}_API_KEY dans
#                   l'environnement (voir .env.example)
#   tool_support  → true si le fournisseur gère le tool calling ; false bascule
#                   sur le mode « schéma JSON annexé au message »
#
# Réglages d'inférence optionnels, par modèle (sinon les défauts de
# config/default.yaml → llm) : temperature, max_tokens, timeout, seed, max_retries.
#
# ─────────────────────────────────────────────────────────────────────────────
# `temperature: null` N'EST PAS UN DÉTAIL DE CONFIG.
#
# Plusieurs modèles récents (famille gpt-5, Claude par la couche OpenAI) ne
# prennent plus de paramètre d'échantillonnage. Envoyer `temperature: 0.7` à
# ceux-là et à leurs concurrents produirait un classement où une partie du panel
# joue à 0.7 et l'autre au défaut du fournisseur : on mesurerait le réglage
# autant que le modèle. `null` supprime l'envoi du paramètre, ce qui est le seul
# état commun à tous.
#
# La colonne est vérifiable, elle n'est pas déclarative :
#   python -m controla.cli models --check
# interroge /models chez le fournisseur et signale tout écart entre ce qui est
# déclaré ici et ce que le modèle accepte réellement.
# ─────────────────────────────────────────────────────────────────────────────
#
# Prix relevés le 2026-08-06 via l'API OpenRouter, en dollars par million de
# tokens (entrée / sortie). Ils bougent : `models --check` les rafraîchit.

# ── Panel « petits et rapides » ──────────────────────────────────────────────
# La cible annoncée : faible latence, coût compatible avec une campagne de
# plusieurs centaines de parties. Une partie à 4 sièges LLM coûte ~180 000
# tokens (FINDINGS n° 5), soit ~1 ct à 0.05 $/Mtok et ~0.20 $ à 1.00 $/Mtok.

qwen/qwen3.7-flash:                     # 0.030 / 0.130
  provider: openrouter
  tool_support: true

openai/gpt-oss-120b:                    # 0.037 / 0.170
  provider: openrouter
  tool_support: true

openai/gpt-5-nano:                      # 0.050 / 0.400
  provider: openrouter
  tool_support: true
  temperature: null                     # famille gpt-5 : paramètre refusé

z-ai/glm-4.7-flash:                     # 0.060 / 0.400
  provider: openrouter
  tool_support: true

mistralai/mistral-small-3.2-24b-instruct:   # 0.094 / 0.250
  provider: openrouter
  tool_support: true

google/gemini-2.5-flash-lite:           # 0.100 / 0.400
  provider: openrouter
  tool_support: true

openai/gpt-4.1-mini:                    # 0.400 / 1.600
  provider: openrouter
  tool_support: true

anthropic/claude-haiku-4.5:             # 1.000 / 5.000
  provider: openrouter
  tool_support: true
  seed: null                            # non supporté par ce modèle

# ── Modèle de TEST (gratuit) ─────────────────────────────────────────────────
# Retenu par `cli bench` le 2026-10-25 (runs/bench/2026-10-25-free.json) : 12
# modèles gratuits, 6 sondes réelles chacun, premier essai, sans relance.
#
#   modèle                     répond  légal  budget  latence médiane / max
#   dots-3-note-preview          6/6   100 %  100 %     26 s / 53 s
#   nemotron-3.5-lightning       6/6   100 %  100 %     60 s / 187 s
#   nemotron-3.5-super-vl        6/6   100 %  100 %     69 s / 191 s
#   cohere/north-mini-code       6/6   100 %  100 %    111 s / 156 s
#   nemotron-3-ultra-550b        5/6   100 %  100 %     32 s / 118 s
#
# Le seul à être à la fois toujours disponible, toujours conforme, et 2 à 4 fois
# plus rapide que les autres modèles fiables. Joue activement (4-5 coups par
# tour) et EXPOSE son raisonnement interne (~80 % de sa sortie). Gemma, Liquid,
# xing et laguna-xs répondaient 429 la plupart du temps : quota partagé du
# fournisseur saturé, pas le nôtre.
#
# ⚠ FILTRE DE CONTENU : son fournisseur (AtlasCloud) coupe parfois la génération
# (`finish_reason: content_filter`) quand le modèle raisonne sur une attaque —
# 2 tours perdus sur 15 dans une partie à 4 sièges, à chaque fois en décidant
# d'attaquer. Bon pour tester le CODE ; pour MESURER des stratégies, il biaise
# vers la paix. Les tours filtrés sont comptés à part (`filtered_turns`).
#
# « preview » : il peut disparaître du gratuit. Remplaçant mesuré :
# nvidia/nemotron-3.5-lightning:free (aussi fiable, ~2× plus lent). Refaire le
# banc avant de remplacer : `python -m controla.cli bench`.
dots-studio/dots-3-note-preview:free:   # 0 / 0 — gratuit
  provider: openrouter
  tool_support: true

dots-studio/dots-3-note-preview:free@memoire:
  model: dots-studio/dots-3-note-preview:free
  provider: openrouter
  tool_support: true
  memory: true

# Même modèle, réflexion courte. MESURÉ le 2026-10-25 : PAS de gain.
#   4 sièges, seed 3 : 12.6 min contre 10.3 (réflexion 2 100 tokens/appel
#   contre 1 806) ; 1 siège, seed 1 : 7.6 min contre 6.5, score 105.7 contre
#   109.9, palier 2 au lieu de 3, et plus de plans vides sans raisonnement.
# Un mini-banc de 2 appels montrait pourtant une réflexion divisée par deux :
# sur une partie entière, le fournisseur ne la raccourcit pas. Gardé pour
# refaire la mesure sur un autre modèle — ne pas en faire le défaut.
dots-studio/dots-3-note-preview:free@low:
  model: dots-studio/dots-3-note-preview:free
  provider: openrouter
  tool_support: true
  reasoning_effort: low

nvidia/nemotron-3.5-lightning:free:     # remplaçant — 0 / 0
  provider: openrouter
  tool_support: true

# ── Palier gratuit OpenRouter ────────────────────────────────────────────────
# ⚠ 2026-10-25 : nemotron-3-nano-omni n'était disponible que 23 % du temps sur
# 24 h (10 % sur 30 min). Gardé pour mémoire ; préférer le modèle de test
# ci-dessus.
# Retenu au terme d'un banc sur les 14 modèles gratuits d'OpenRouter déclarant
# `tools` + `reasoning`, mesurés sur le VRAI prompt d'un tour (~6 000 tokens
# d'entrée), 9 appels. C'est le seul à réunir les trois exigences :
#
#   * `tool_choice` NOMMÉ accepté — ce que `backend._call_with_tool` force. La
#     moitié du panel gratuit le refuse (gpt-oss-20b, gemma-4-31b), et un modèle
#     qui le refuse ne joue pas, si rapide soit-il ;
#   * 9 plans exploitables sur 9, et 0 index hors masque sur 30 proposés ;
#   * raisonnement EXPOSÉ à chaque réponse (2 644 tokens médians), ce qui est la
#     matière première du finding de T6 : sans lui on sait qui gagne, pas pourquoi.
#
# Latence médiane 24 s (11 à 42). Deux fois plus lent que `laguna-xs`, qui
# n'expose aucun raisonnement — d'où l'arbitrage.
#
# Ni `temperature` ni `seed` ne sont neutralisés : le fournisseur les annonce tous
# deux comme acceptés, et `models --check` le revérifie.
nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free:   # 0 / 0 — gratuit
  provider: openrouter
  tool_support: true

# ── Étude mémoire : le même modèle, avec et sans mémoire ────────────────────
# Une VARIANTE est un siège à part qui appelle le même modèle (`model:`). Les
# deux variantes sont classées séparément — c'est l'expérience : opposer un
# modèle à lui-même, la mémoire étant la seule différence.
#
#   python -m controla.cli tournament --seeds 1,2,3,4,5,6 \
#     --policies openai/gpt-5-nano,openai/gpt-5-nano@memoire,cooperator,turtle
#
# `memory: true` rejoue à chaque tour la conversation des tours précédents
# (~15 000 tokens d'entrée en fin de partie). Elle ne fait que s'allonger : son
# préfixe est donc cachable, et c'est ce qui rend l'étude abordable.
#
# Cache de prompt, selon le fournisseur :
#   * OpenAI, DeepSeek, Gemini 2.5+ : IMPLICITE dès 1 024 tokens de préfixe
#     stable. Rien à déclarer. Le système (~2 400 tokens) se cache dans les
#     deux variantes ; l'historique en plus dans la variante à mémoire.
#   * Anthropic : EXPLICITE — `cache_control: true` pose le point de cache. Le
#     seuil de Haiku 4.5 est de 4 096 tokens : sans mémoire le prompt reste
#     sous le seuil et ne se cache jamais, avec mémoire il le franchit vers le
#     3e tour. L'écart de COÛT entre les deux variantes mesure donc la mémoire
#     ET le cache ; l'écart de JEU, lui, ne mesure que la mémoire.
#
# `cached_tokens` et `cache_write_tokens` sont relevés dans chaque partie
# (policy_reports → backend) : vérifier que le cache prend, plutôt que le
# supposer.

openai/gpt-5-nano@memoire:
  model: openai/gpt-5-nano
  provider: openrouter
  tool_support: true
  temperature: null                     # famille gpt-5 : paramètre refusé
  memory: true

anthropic/claude-haiku-4.5@cache:
  model: anthropic/claude-haiku-4.5
  provider: openrouter
  tool_support: true
  seed: null
  cache_control: true

anthropic/claude-haiku-4.5@memoire:
  model: anthropic/claude-haiku-4.5
  provider: openrouter
  tool_support: true
  seed: null
  cache_control: true
  memory: true

# Gratuit : pour dérouler l'étude de bout en bout sans payer, avant de la
# lancer sur des modèles facturés.
nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free@memoire:
  model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
  provider: openrouter
  tool_support: true
  memory: true

# ── Ancres ───────────────────────────────────────────────────────────────────
# Un banc de petits modèles a besoin d'un plafond connu : sans lui, on ne sait
# pas si un écart de 10 points d'ordinal est beaucoup ou peu. Ces deux-là ne
# servent qu'à cadrer l'échelle, pas à peupler les campagnes — ils coûtent
# 20 à 50 fois le reste du panel.

anthropic/claude-sonnet-5:              # 2.000 / 10.000
  provider: openrouter
  tool_support: true
  temperature: null                     # paramètre refusé
  seed: null

openai/gpt-5.2:                         # 1.750 / 14.000
  provider: openrouter
  tool_support: true
  temperature: null                     # famille gpt-5 : paramètre refusé

